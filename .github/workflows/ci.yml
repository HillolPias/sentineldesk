name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentineldesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentineldesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentineldesk_test
      REDIS_URL: redis://localhost:6379
      OPENAI_API_KEY: sk-ci-not-real
      LANGFUSE_PUBLIC_KEY: pk-lf-ci
      LANGFUSE_SECRET_KEY: sk-lf-ci
      LANGFUSE_HOST: https://cloud.langfuse.com
      LANGFUSE_TRACING_ENABLED: "false"
      JWT_SECRET: ci-secret
      STRIPE_SECRET_KEY: sk_test_ci_not_real
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Enable pgvector
        run: PGPASSWORD=sentinel psql -h localhost -U sentinel -d sentineldesk_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Migrate an empty database
        run: uv run alembic upgrade head

      - name: Check models match migrations
        run: uv run alembic check

      - name: Tests
        run: uv run pytest -v

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sentineldesk-api apps/api
